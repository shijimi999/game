<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#232b23" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="CARRY YOU" />
<title>CARRY YOU</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", YuGothic, "Noto Sans JP", system-ui, sans-serif;
    background: #aeb8ab;
    color: #fff;
    overflow-x: hidden;
  }

  .poster {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    isolation: isolate;
    overflow: hidden;
  }

  /* ---------- scene ---------- */
  .scene {
    position: absolute;
    inset: 0;
    z-index: -2;
  }
  .scene svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* soft overcast light + quiet vignette, poster-like */
  .veil {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(to bottom, rgba(38,46,40,.18) 0%, rgba(38,46,40,0) 26%, rgba(38,46,40,0) 52%, rgba(24,30,26,.38) 100%),
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(20,26,22,.28) 100%);
  }

  /* ---------- content ---------- */
  .content {
    text-align: center;
    padding: 3rem 1.25rem 4.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 10vw, 5.6rem);
    font-weight: 300;
    letter-spacing: .34em;
    /* compensate the trailing tracking so it sits optically centred */
    text-indent: .34em;
    line-height: 1.15;
    color: #f4f6f2;
    text-shadow: 0 1px 2px rgba(20,28,22,.45), 0 2px 22px rgba(20,28,22,.35);
    white-space: nowrap;
  }

  .start {
    margin-top: clamp(2.2rem, 6vh, 3.6rem);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: .8rem 2.1rem;
    border: 1px solid rgba(244,246,242,.85);
    background: rgba(24,32,26,.32);
    color: #f4f6f2;
    font-size: .95rem;
    letter-spacing: .18em;
    text-indent: .18em;
    text-decoration: none;
    transition: background .25s ease, border-color .25s ease;
  }
  .start:hover { background: rgba(24,32,26,.55); border-color: #fff; }
  .start:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
    background: rgba(24,32,26,.55);
  }

  .notes {
    margin: clamp(1.4rem, 4vh, 2rem) 0 0;
    display: flex;
    align-items: center;
    gap: .9em;
    font-size: .78rem;
    letter-spacing: .22em;
    text-indent: .22em;
    color: rgba(238,242,236,.88);
    text-shadow: 0 1px 6px rgba(20,28,22,.5);
  }
  .notes .sep {
    width: 3px; height: 3px;
    background: rgba(238,242,236,.7);
    flex: none;
  }

  @media (max-width: 480px) {
    h1 { font-size: clamp(2.1rem, 12.5vw, 2.6rem); letter-spacing: .26em; text-indent: .26em; }
    .start { width: min(78vw, 300px); padding-left: 1rem; padding-right: 1rem; }
    .notes { font-size: .72rem; letter-spacing: .16em; text-indent: .16em; gap: .7em; }
    .content { padding-bottom: 5.5rem; }
  }
</style>
</head>
<body>
<main class="poster">
