<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>COVERLINE</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", YuGothic, "Noto Sans JP", system-ui, sans-serif;
    background: #99a1a6;
    color: #fff;
    overflow-x: hidden;
  }

  .poster {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    isolation: isolate;
    overflow: hidden;
  }

  /* ---------- scene ---------- */
  .scene {
    position: absolute;
    inset: 0;
    z-index: -2;
  }
  .scene svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* overcast daylight: flat cool light from above, gentle darkening toward the street */
  .veil {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(to bottom, rgba(52,60,66,.16) 0%, rgba(52,60,66,0) 26%, rgba(52,60,66,0) 52%, rgba(30,36,40,.34) 100%),
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(24,30,34,.26) 100%);
  }

  /* slow cloud drift */
  .clouds-a { animation: drift-a 90s linear infinite alternate; }
  .clouds-b { animation: drift-b 120s linear infinite alternate; }
  @keyframes drift-a { from { transform: translateX(0); } to { transform: translateX(26px); } }
  @keyframes drift-b { from { transform: translateX(0); } to { transform: translateX(-20px); } }
  @media (prefers-reduced-motion: reduce) {
    .clouds-a, .clouds-b { animation: none; }
  }

  /* ---------- content ---------- */
  .content {
    text-align: center;
    padding: 3rem 1.25rem 4.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 10vw, 5.6rem);
    font-weight: 300;
    letter-spacing: .30em;
    /* compensate the trailing tracking so it sits optically centred */
    text-indent: .30em;
    line-height: 1.15;
    color: #f2f4f3;
    text-shadow: 0 1px 2px rgba(24,32,38,.45), 0 2px 22px rgba(24,32,38,.35);
    white-space: nowrap;
  }

  .subtitle {
    margin: 1.1rem 0 0;
    font-size: clamp(.82rem, 2.6vw, 1rem);
    font-weight: 400;
    letter-spacing: .62em;
    text-indent: .62em;
    color: rgba(240,243,242,.92);
    text-shadow: 0 1px 6px rgba(24,32,38,.55);
  }
  .subtitle::before,
  .subtitle::after {
    content: "";
    display: inline-block;
    vertical-align: middle;
    width: 2.2em;
    height: 1px;
    background: rgba(240,243,242,.55);
    margin: 0 .9em 0 0;
  }
  .subtitle::after { margin: 0 0 0 .9em; }

  .start {
    margin-top: clamp(2.2rem, 6vh, 3.6rem);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: .8rem 2.1rem;
    border: 1px solid rgba(242,244,243,.85);
    background: rgba(26,33,38,.32);
    color: #f2f4f3;
    font-size: .95rem;
    letter-spacing: .18em;
    text-indent: .18em;
    text-decoration: none;
    transition: background .25s ease, border-color .25s ease;
  }
  .start:hover { background: rgba(26,33,38,.55); border-color: #fff; }
  .start:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
    background: rgba(26,33,38,.55);
  }

  .notes {
    margin: clamp(1.4rem, 4vh, 2rem) 0 0;
    display: flex;
    align-items: center;
    gap: .9em;
    font-size: .78rem;
    letter-spacing: .22em;
    text-indent: .22em;
    color: rgba(236,240,239,.88);
    text-shadow: 0 1px 6px rgba(24,32,38,.5);
  }
  .notes .sep {
    width: 3px; height: 3px;
    background: rgba(236,240,239,.7);
    flex: none;
  }

  @media (max-width: 480px) {
    h1 { font-size: clamp(2rem, 12vw, 2.6rem); letter-spacing: .22em; text-indent: .22em; }
    .subtitle { letter-spacing: .44em; text-indent: .44em; }
    .subtitle::before, .subtitle::after { width: 1.2em; }
    .start { width: min(78vw, 300px); padding-left: 1rem; padding-right: 1rem; }
    .notes { font-size: .72rem; letter-spacing: .14em; text-indent: .14em; gap: .65em; flex-wrap: wrap; justify-content: center; }
    .content { padding-bottom: 5.5rem; }
  }
</style>
</head>
